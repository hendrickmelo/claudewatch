[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudewatch"
version = "0.1.0"
description = "macOS menubar app showing Claude Code rate limits and session status"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Hendrick Melo" },
]
keywords = ["claude", "claude-code", "menubar", "macos", "rate-limit", "t3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "keyring>=24",
    "psutil>=5.9",
    "rumps>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/hendrickmelo/claudewatch"
Repository = "https://github.com/hendrickmelo/claudewatch"
Issues = "https://github.com/hendrickmelo/claudewatch/issues"

[project.scripts]
claudewatch = "claudewatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudewatch"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "LICENSE"]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.uv]
# rumps/pyobjc only resolve on macOS
environments = ["sys_platform == 'darwin'"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
