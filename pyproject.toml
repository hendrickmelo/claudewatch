[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudewatch"
version = "0.1.0"
description = "Menubar/tray app showing Claude Code rate limits and session status (macOS + Windows)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Hendrick Melo" },
]
keywords = ["claude", "claude-code", "menubar", "tray", "macos", "windows", "rate-limit", "t3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "keyring>=24",
    "psutil>=5.9",
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "pystray>=0.19; sys_platform == 'win32'",
    "Pillow>=10; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/hendrickmelo/claudewatch"
Repository = "https://github.com/hendrickmelo/claudewatch"
Issues = "https://github.com/hendrickmelo/claudewatch/issues"

[project.scripts]
claudewatch = "claudewatch.cli:main"

[project.gui-scripts]
# Windows-only: pip's gui-scripts entry installs as claudewatchw.exe, which
# launches via pythonw.exe (no console window flashing on tray-app start).
claudewatchw = "claudewatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudewatch"]

[tool.hatch.build.targets.sdist]
include = ["src/", "README.md", "LICENSE"]

[project.optional-dependencies]
macos = ["rumps>=0.4.0"]
windows = ["pystray>=0.19", "Pillow>=10"]
dev = [
    "Pillow>=10",  # icon_render tests; ships unconditionally on Windows already
    "pyinstaller>=6; sys_platform == 'win32'",
    "pytest>=8",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
